name: Quality
on:
  pull_request:
  push:
    branches: [main]
env:
  PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t03-ui-evidence-${{ github.run_id }}
          path: docs/implementation/evidence/T03/*.png
          if-no-files-found: ignore
          retention-days: 7
